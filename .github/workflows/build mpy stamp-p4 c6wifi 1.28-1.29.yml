# 文件名保留 1.28-1.29 历史名（GitHub Actions 按 name 触发，改名不影响使用）
name: build mpy stamp-p4 c6wifi 1.27-1.29

# 仅手动触发
on:
  workflow_dispatch:

# 并发控制：同一分支只保留最新一次
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  MICROPYTHON_DIR: ${{ github.workspace }}/micropython
  ESP_IDF_DIR: ${{ github.workspace }}/esp-idf
  ARTIFACTS_DIR: ${{ github.workspace }}/artifacts
  # esp-idf 版本：对齐 UIFLOW2 实证配方（IDF v5.5.4 + esp_hosted 2.12.0 + esp_wifi_remote 1.4.0）
  ESP_IDF_VERSION: v5.5.4

jobs:
  build:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - mpy_version: v1.29.0
          - mpy_version: v1.28.0
          - mpy_version: v1.27.0

    steps:
      # 1. 检出当前仓库（含 stamp-p4/ 自定义板目录）
      - name: Checkout repo
        uses: actions/checkout@v4

      # 2. 缓存 ESP-IDF 与 MicroPython（key 带 -stamp4v4：配置方式变更后强制刷新缓存）
      - name: Cache ESP-IDF and MicroPython
        id: cache_all
        uses: actions/cache@v4
        with:
          path: |
            ${{ env.ESP_IDF_DIR }}
            ~/.espressif/
            ~/.cache/pip/
            ${{ env.MICROPYTHON_DIR }}
          key: mpy-${{ matrix.mpy_version }}-idf-${{ env.ESP_IDF_VERSION }}-stamp4v4

      # 3. 安装系统依赖（仅在缓存未命中时）
      - name: Install system dependencies
        if: steps.cache_all.outputs.cache-hit != 'true'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            git wget flex bison gperf python3 python3-pip python3-venv \
            cmake ninja-build ccache libffi-dev libssl-dev dfu-util libusb-1.0-0 patch

      # 4. 克隆 MicroPython（仅在缓存未命中时）
      - name: Clone MicroPython
        if: steps.cache_all.outputs.cache-hit != 'true'
        run: |
          git clone --depth 1 --branch ${{ matrix.mpy_version }} \
            https://github.com/micropython/micropython.git ${{ env.MICROPYTHON_DIR }}
          cd ${{ env.MICROPYTHON_DIR }}
          git submodule update --init --depth 1
          make -C mpy-cross

      # 5. 克隆并配置 ESP-IDF（仅在缓存未命中时，目标含 esp32p4）
      - name: Clone & setup ESP-IDF
        if: steps.cache_all.outputs.cache-hit != 'true'
        run: |
          git clone --depth 1 --branch ${{ env.ESP_IDF_VERSION }} \
            https://github.com/espressif/esp-idf.git ${{ env.ESP_IDF_DIR }}
          git -C ${{ env.ESP_IDF_DIR }} submodule update --init --recursive --filter=tree:0
          ${{ env.ESP_IDF_DIR }}/install.sh esp32p4

      # 6. 导入 Stamp-P4 自定义板 + 组件版本对齐
      #    板级配置全部在 stamp-p4/ 目录（sdkconfig 单文件），无 sed 补丁链
      #    组件配方对齐 UIFLOW2 master（V2.5.4，本板实测联网可用）：
      #       esp_hosted 2.12.0 + esp_wifi_remote 1.4.0
      #    板载 C6 从机固件已实测为 2.12.1（UIFLOW2 REPL: esp_hosted_utils.get_slave_firmware_version()），
      #    与 host 2.12.0 同世代配套 —— 旧"从机是 1.4.x 世代"推断作废
      - name: Install Stamp-P4 board & align components
        run: |
          # 自定义板目录导入 micropython
          cp -r ${{ github.workspace }}/stamp-p4 \
            ${{ env.MICROPYTHON_DIR }}/ports/esp32/boards/STAMP_P4_C6
          # 组件版本对齐 UIFLOW2 配方
          sed -i 's/version: "2.7.0"/version: "2.12.0"/' \
            ${{ env.MICROPYTHON_DIR }}/ports/esp32/main/idf_component.yml
          sed -i 's/version: "0.15.2"/version: "1.4.0"/' \
            ${{ env.MICROPYTHON_DIR }}/ports/esp32/main/idf_component.yml
          rm -f ${{ env.MICROPYTHON_DIR }}/ports/esp32/dependencies.lock
          rm -rf ${{ env.MICROPYTHON_DIR }}/ports/esp32/managed_components
          # BLE：NimBLE over esp_hosted（UIFLOW2 配方）。
          # 按 mpy 版本选补丁（两份都已本地 dry-run 验证）：
          #   1.27       → 0002（UIFLOW2 原版 0027+0032 上下文，1.27 为 plain nimble_port_init）
          #   1.28/1.29 → 0001（适配 1.28 新增的 MICROPY_BLUETOOTH_NIMBLE_PORT_INIT_RETURNS_ERROR 条件块）
          if [ "${{ matrix.mpy_version }}" = "v1.27.0" ]; then
            BLE_PATCH=stamp-p4/patches/0002-esp32p4-esp-hosted-nimble-mpy1.27.patch
          else
            BLE_PATCH=stamp-p4/patches/0001-esp32p4-esp-hosted-nimble-mpy1.28-1.29.patch
          fi
          # 缓存命中的源码已打过补丁（grep 守卫保证幂等）
          if ! grep -q "__wrap_hci_rx_handler" \
            ${{ env.MICROPYTHON_DIR }}/ports/esp32/mpnimbleport.c; then
            patch -d ${{ env.MICROPYTHON_DIR }} -p1 \
              < ${{ github.workspace }}/${BLE_PATCH}
          else
            echo "BLE patch already applied (cached source), skipping"
          fi
          # esp_hosted HCI RX 与 NimBLE 池销毁串行化（UIFLOW2 m5stack/CMakeLists.txt:109 同款）
          if ! grep -q "wrap=hci_rx_handler" \
            ${{ env.MICROPYTHON_DIR }}/ports/esp32/CMakeLists.txt; then
            cat >> ${{ env.MICROPYTHON_DIR }}/ports/esp32/CMakeLists.txt << 'EOF'

# Stamp-P4 + esp_hosted: serialize Hosted HCI RX against NimBLE pool teardown
if(CONFIG_IDF_TARGET_ESP32P4 AND CONFIG_ESP_HOSTED_ENABLE_BT_NIMBLE)
    target_link_options(micropython.elf PRIVATE "-Wl,--wrap=hci_rx_handler")
endif()
EOF
          fi
          # 注：esp_wifi_remote 1.4.0 头文件为新世代，WIFI_AUTH_WPA_ENTERPRISE /
          #     WIFI_AUTH_MAX==17 均存在，0.8.5 时代的 network_wlan.c sed 兼容补丁全部删除
          # 强制清除缓存的构建目录与 sdkconfig（micropython 只在首次生成时应用
          # sdkconfig.defaults；缓存的旧 sdkconfig 会覆盖板级配置，必须删除重建）
          rm -rf ${{ env.MICROPYTHON_DIR }}/ports/esp32/build-*
          rm -f  ${{ env.MICROPYTHON_DIR }}/ports/esp32/sdkconfig*
          echo "---- 组件版本核对 ----"
          grep -E "esp_hosted|esp_wifi_remote" \
            ${{ env.MICROPYTHON_DIR }}/ports/esp32/main/idf_component.yml | grep -E "espressif|version"

      # 7. 编译固件（自定义板 STAMP_P4_C6）
      - name: Build firmware
        run: |
          source ${{ env.ESP_IDF_DIR }}/export.sh
          cd ${{ env.MICROPYTHON_DIR }}/ports/esp32
          make BOARD=STAMP_P4_C6 FLASH_SIZE=16MB -j$(nproc)

      # 8. 自检：SDIO 引脚 / 芯片版本 / 组件版本 必须真实生效
      # 9. 收集固件（firmware.bin 为 0x2000 起烧的合并镜像）
      - name: Rename firmware
        run: |
          mkdir -p ${{ env.ARTIFACTS_DIR }}
          B="${{ env.MICROPYTHON_DIR }}/ports/esp32/build-STAMP_P4_C6"
          MPYV=$(echo "${{ matrix.mpy_version }}" | sed 's/^v//;s/\.0$//')
          OUT="mpy_${MPYV}_STAMP_P4_C6_16MB"
          cp "$B/firmware.bin" "${{ env.ARTIFACTS_DIR }}/${OUT}_firmware.bin"
          cp "$B/bootloader/bootloader.bin" "${{ env.ARTIFACTS_DIR }}/${OUT}_bootloader.bin"
          cp "$B/partition_table/partition-table.bin" "${{ env.ARTIFACTS_DIR }}/${OUT}_partition-table.bin"
          cp "$B/sdkconfig" "${{ env.ARTIFACTS_DIR }}/${OUT}_sdkconfig.txt"
          ls -la ${{ env.ARTIFACTS_DIR }}

      # 10. 上传构建产物
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: mpy-stamp-p4-mpy${{ matrix.mpy_version }}
          path: ${{ env.ARTIFACTS_DIR }}/*
