# 通用 ESP32_GENERIC_S3 固件：MicroPython v1.29 + st7789 + ota（WebREPL 为端口内置，无需构建）
# 差异（相对 1.27 旧版）：
#   1. mpy v1.29.0 + IDF v5.5.4
#   2. st7789 改用仓库根目录 vendor 的 modules/st7789（不再 clone russhughes）
#   3. 增加 ota C 模块 + 双 OTA 槽分区表（按 flash 大小 8/16MB 选表）+ 回滚保护
# 注意：改了本工作流配置时必须升级缓存 key 后缀（-st7789-ota-vN）
name: build mpy with st7789 1.29

on:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  MICROPYTHON_DIR: ${{ github.workspace }}/micropython
  ESP_IDF_DIR: ${{ github.workspace }}/esp-idf
  ARTIFACTS_DIR: ${{ github.workspace }}/artifacts
  # micropython版本
  MPY_VERSION: v1.29.0
  # esp-idf版本
  ESP_IDF_VERSION: v5.5.4

jobs:
  build:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
      # 开发板矩阵，可以添加不同的开发板
        include:
          - board: ESP32_GENERIC_S3
            variant: ""
            flash_size: 8
          - board: ESP32_GENERIC_S3
            variant: SPIRAM_OCT
            flash_size: 16
          - board: ESP32_GENERIC_S3
            variant: SPIRAM_OCT
            flash_size: 8

    steps:
      # 1. 检出当前仓库（含 vendor 的 modules/st7789、modules/ota 与 generic/ 分区表）
      - name: Checkout repo
        uses: actions/checkout@v6

      # 2. 缓存 ESP-IDF 与 MicroPython
      - name: Cache ESP-IDF and MicroPython
        id: cache_all
        uses: actions/cache@v4
        with:
          path: |
            ${{ env.ESP_IDF_DIR }}
            ~/.espressif/
            ~/.cache/pip/
            ${{ env.MICROPYTHON_DIR }}
          key: mpy-${{ env.MPY_VERSION }}-idf-${{ env.ESP_IDF_VERSION }}-st7789-ota-v2

      # 3. 安装系统依赖（仅在缓存未命中时）
      - name: Install system dependencies
        if: steps.cache_all.outputs.cache-hit != 'true'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            git wget flex bison gperf python3 python3-pip python3-venv \
            cmake ninja-build ccache libffi-dev libssl-dev dfu-util libusb-1.0-0

      # 4. 克隆 MicroPython（仅在缓存未命中时）
      - name: Clone MicroPython
        if: steps.cache_all.outputs.cache-hit != 'true'
        run: |
          git clone --depth 1 --branch ${{ env.MPY_VERSION }} \
            https://github.com/micropython/micropython.git ${{ env.MICROPYTHON_DIR }}
          cd ${{ env.MICROPYTHON_DIR }}
          git submodule update --init --depth 1
          make -C mpy-cross

      # 5. 克隆并配置 ESP-IDF（仅在缓存未命中时）
      - name: Clone & setup ESP-IDF
        if: steps.cache_all.outputs.cache-hit != 'true'
        run: |
          git clone --depth 1 --branch ${{ env.ESP_IDF_VERSION }} \
            https://github.com/espressif/esp-idf.git ${{ env.ESP_IDF_DIR }}
          git -C ${{ env.ESP_IDF_DIR }} submodule update --init --recursive --filter=tree:0
          ${{ env.ESP_IDF_DIR }}/install.sh esp32,esp32s3,esp32c3

      # 6. 生成 user_modules.cmake（st7789 vendor 版 + ota 公共模块）
      - name: Generate user_modules.cmake
        run: |
          cat > ${{ github.workspace }}/user_modules.cmake <<'EOF'
          include("${CMAKE_CURRENT_LIST_DIR}/modules/st7789/micropython.cmake")
          include("${CMAKE_CURRENT_LIST_DIR}/modules/ota/micropython.cmake")
          EOF

      # 7. OTA 差异项：按 flash 大小复制双 OTA 槽分区表 + 注入 sdkconfig + 回滚保护
      - name: Install OTA partitions & config
        run: |
          F=${{ matrix.flash_size }}
          # 1) 双 OTA 乒乓分区表（Kconfig 的 CUSTOM_FILENAME 相对项目目录解析）
          cp ${{ github.workspace }}/generic/partitions-${F}mb-ota.csv \
            ${{ env.MICROPYTHON_DIR }}/ports/esp32/partitions-${F}mb-ota.csv
          # 2) 板级追加 sdkconfig（ESP32_GENERIC_S3 无板级 sdkconfig 文件，追加进板 cmake）
          cat > ${{ env.MICROPYTHON_DIR }}/ports/esp32/boards/sdkconfig.ota_generic <<EOF
          CONFIG_ESPTOOLPY_FLASHSIZE_${F}MB=y
          CONFIG_PARTITION_TABLE_CUSTOM=y
          CONFIG_PARTITION_TABLE_CUSTOM_FILENAME="partitions-${F}mb-ota.csv"
          CONFIG_BOOTLOADER_APP_ROLLBACK_ENABLE=y
          EOF
          B_CMAKE=${{ env.MICROPYTHON_DIR }}/ports/esp32/boards/ESP32_GENERIC_S3/mpconfigboard.cmake
          grep -q "sdkconfig.ota_generic" "$B_CMAKE" || \
            echo 'list(APPEND SDKCONFIG_DEFAULTS boards/sdkconfig.ota_generic)' >> "$B_CMAKE"
          # 清除缓存的构建目录与 sdkconfig
          rm -rf ${{ env.MICROPYTHON_DIR }}/ports/esp32/build-*
          rm -f  ${{ env.MICROPYTHON_DIR }}/ports/esp32/sdkconfig*

      # 8. 编译固件
      - name: Build firmware
        run: |
          source ${{ env.ESP_IDF_DIR }}/export.sh
          cd ${{ env.MICROPYTHON_DIR }}/ports/esp32
          make BOARD=${{ matrix.board }} \
               ${{ matrix.variant && format('BOARD_VARIANT={0}', matrix.variant) || '' }} \
               FLASH_SIZE=${{ matrix.flash_size }}MB \
               USER_C_MODULES="${{ github.workspace }}/user_modules.cmake" \
               -j$(nproc)

      # 9. 自检：分区表含 ota_0/ota_1/otadata、回滚保护、ota 与 st7789 模块已编入
      - name: Verify build config
        run: |
          BOARD_NAME="${{ matrix.board }}"
          [[ -n "${{ matrix.variant }}" ]] && BOARD_NAME+="-${{ matrix.variant }}"
          B="${{ env.MICROPYTHON_DIR }}/ports/esp32/build-${BOARD_NAME}"
          echo "---- 分区表自检 ----"
          PT=$(python3 ${{ env.ESP_IDF_DIR }}/components/partition_table/gen_esp32part.py \
            "$B/partition_table/partition-table.bin")
          echo "$PT"
          if echo "$PT" | grep -q "ota_0" && echo "$PT" | grep -q "ota_1" \
            && echo "$PT" | grep -q "otadata" && echo "$PT" | grep -q "vfs"; then
            echo "OTA partition check: OK"
          else
            echo "OTA partitions missing!"
            exit 1
          fi
          echo "---- 回滚保护 / flash 大小自检 ----"
          grep -q "CONFIG_BOOTLOADER_APP_ROLLBACK_ENABLE=y" "$B/sdkconfig" \
            && echo "rollback enable: OK" || { echo "rollback not enabled!"; exit 1; }
          grep -q "CONFIG_ESPTOOLPY_FLASHSIZE_${{ matrix.flash_size }}MB=y" "$B/sdkconfig" \
            && echo "flash ${{ matrix.flash_size }}MB: OK" || { echo "flash size wrong!"; exit 1; }
          echo "---- 模块符号自检 ----"
          strings "$B/micropython.elf" | grep -m1 "mark_invalid_reboot" \
            && echo "ota module linked: OK" || { echo "ota module missing"; exit 1; }
          strings "$B/micropython.elf" | grep -m1 "ST7789" \
            && echo "st7789 module linked: OK" || { echo "st7789 module missing"; exit 1; }
          # WebREPL 为端口内置冻结模块，非致命检查
          strings "$B/micropython.elf" | grep -m1 "webrepl" \
            && echo "webrepl frozen: OK" || echo "webrepl check skipped (non-fatal)"

      # 10. 重命名并收集固件（只打包 bin：firmware 首烧 / micropython 为 OTA 载荷）
      - name: Rename firmware
        run: |
          mkdir -p ${{ env.ARTIFACTS_DIR }}
          BOARD_NAME="${{ matrix.board }}"
          [[ -n "${{ matrix.variant }}" ]] && BOARD_NAME+="-${{ matrix.variant }}"
          B="${{ env.MICROPYTHON_DIR }}/ports/esp32/build-${BOARD_NAME}"
          OUT="mpy_1.29_${BOARD_NAME}_${{ matrix.flash_size }}MB"
          cp "$B/firmware.bin" "${{ env.ARTIFACTS_DIR }}/${OUT}_firmware.bin"
          cp "$B/micropython.bin" "${{ env.ARTIFACTS_DIR }}/${OUT}_micropython.bin"
          cp "$B/bootloader/bootloader.bin" "${{ env.ARTIFACTS_DIR }}/${OUT}_bootloader.bin"
          cp "$B/partition_table/partition-table.bin" "${{ env.ARTIFACTS_DIR }}/${OUT}_partition-table.bin"
          ls -la ${{ env.ARTIFACTS_DIR }}

      # 11. 上传构建产物
      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: mpy_st7789_ota-${{ matrix.board }}${{ matrix.variant && format('_{0}', matrix.variant) || '' }}_${{ matrix.flash_size }}MB
          path: ${{ env.ARTIFACTS_DIR }}/*
